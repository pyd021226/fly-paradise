name: Release

# 打 tag（如 v0.3.7）时自动打包两个版本（安装包 + 便携版，共 4 个 exe）并挂到 GitHub Release。
# 也可以在 Actions 页面手动 workflow_dispatch：只构建、不发版，用来验证打包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: package (安装包 + 便携版)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tag 和 package.json 版本不一致会让产物文件名和 Release 标题对不上
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eux
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的版本 $ver 不一致"
            exit 1
          fi

      - name: Package breed + annoy (nsis + portable)
        run: npm run dist:all

      - name: Show artifacts
        shell: bash
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: fly-paradise-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      # 手动触发时只到上面为止，不发版
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
