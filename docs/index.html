<title>密码子进化树</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f6f2; --ink:#1b201c; --muted:#667068; --line:#d9ded6; --card:#ffffff;
    --green:#178a4e; --green-bg:#e3f2e9;
    --red:#b2402a; --red-bg:#f6e5e0;
    --amber:#a3741d; --amber-bg:#f4ecd9;
    --hidden:#89908b; --hidden-bg:#ecefea;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111511; --ink:#e7ece5; --muted:#98a199; --line:#283028; --card:#181e19;
      --green:#46cf88; --green-bg:#12321f;
      --red:#ea846a; --red-bg:#3c1d15;
      --amber:#ddb04e; --amber-bg:#332a18;
      --hidden:#7c857d; --hidden-bg:#1f251f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111511; --ink:#e7ece5; --muted:#98a199; --line:#283028; --card:#181e19;
    --green:#46cf88; --green-bg:#12321f;
    --red:#ea846a; --red-bg:#3c1d15;
    --amber:#ddb04e; --amber-bg:#332a18;
    --hidden:#7c857d; --hidden-bg:#1f251f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; padding:24px 16px 56px;
  }
  .wrap{max-width:900px; margin:0 auto}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  h1{font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em}
  .sub{color:var(--muted); font-size:13px; margin:0 0 16px; max-width:64ch}
  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:16px}
  .legend .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
  /* console */
  .console{
    position:sticky; top:0; background:var(--paper);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; z-index:5;
  }
  .console input[type=range]{flex:1; min-width:160px; accent-color:var(--green)}
  .console .readout{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted); white-space:nowrap}
  .console .readout b{color:var(--ink); font-weight:600}
  /* tree */
  .tree-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:10px 6px}
  .node{
    display:flex; align-items:center; gap:8px;
    padding:2px 6px; white-space:nowrap; font-size:13.5px; border-radius:6px;
    margin-left:calc(var(--d) * 18px); min-width:max-content;
  }
  .node .chain{font-family:"IBM Plex Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:0.02em; color:var(--muted)}
  .node .chain.lit{color:var(--ink); font-weight:600}
  .badge{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; flex:none}
  .badge.l1{background:var(--green-bg); color:var(--green)}
  .badge.l2{background:var(--red-bg); color:var(--red)}
  .badge.l3{background:var(--amber-bg); color:var(--amber)}
  .badge.hidden{background:var(--hidden-bg); color:var(--hidden); font-weight:500}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>密码子进化树</h1>
  </header>
  <p class="sub">从 <b>11</b> 开始，每代接 1 / 2 / 3 / 4 往后长。前 4 位凑成 <b>1124</b> 才算绿，之后接 4 续、接 1/2/3 隐、隐后再接 4 升级（红 → 更高）。前 4 位没凑成 1124 的，永远普通。</p>
  <div class="legend">
    <span class="chip"><span class="dot" style="background:var(--green)"></span>绿（Lv.1）</span>
    <span class="chip"><span class="dot" style="background:var(--red)"></span>红（Lv.2）</span>
    <span class="chip"><span class="dot" style="background:var(--amber)"></span>Lv.3+</span>
    <span class="chip"><span class="dot" style="background:var(--hidden)"></span>隐（有绿基因，暂时不显）</span>
    <span class="chip" style="color:var(--muted)">无徽章 = 普通</span>
  </div>

  <div class="console">
    <input type="range" id="depth" min="0" max="8" value="4">
    <span class="readout" id="readout"></span>
  </div>

  <div class="tree-scroll" id="tree"></div>
</div>

<script>
  function nodeState(chain){
    if (chain.length < 4 || chain.slice(0,4) !== '1124') return { badge:false };
    let level = 1, on = true;
    for (let k = 4; k < chain.length; k++){
      const d = chain[k];
      if (on){ if (d !== '4') on = false; }
      else { if (d === '4') level++; on = true; }
    }
    if (!on) return { badge:true, cls:'hidden', label: level === 1 ? '隐' : '隐·Lv' + level };
    if (level === 1) return { badge:true, cls:'l1', label:'绿' };
    if (level === 2) return { badge:true, cls:'l2', label:'红' };
    return { badge:true, cls:'l3', label:'Lv.' + level };
  }

  const tree = document.getElementById('tree');

  function render(depth){
    let html = '';
    (function rec(chain, d){
      const st = nodeState(chain);
      const lit = chain.slice(0,4) === '1124';
      html += '<div class="node" style="--d:' + d + '">'
           +  '<span class="chain' + (lit ? ' lit' : '') + '">' + chain + '</span>';
      if (st.badge) html += '<span class="badge ' + st.cls + '">' + st.label + '</span>';
      html += '</div>';
      if (d < depth) for (const x of '1234') rec(chain + x, d + 1);
    })('11', 0);
    tree.innerHTML = html;
  }

  const depthInput = document.getElementById('depth');
  const readout = document.getElementById('readout');

  function update(){
    const n = Number(depthInput.value);
    const leaves = Math.pow(4, n);
    readout.innerHTML = '第 <b>' + n + '</b> 代 · 共 <b>' + leaves.toLocaleString('en-US') + '</b> 条链';
    render(n);
  }
  depthInput.addEventListener('input', update);
  update();
</script>
