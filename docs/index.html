<title>密码子进化树</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f6f2; --ink:#1b201c; --muted:#667068; --line:#d9ded6; --card:#ffffff;
    --green:#178a4e; --green-bg:#e3f2e9;
    --red:#b2402a; --red-bg:#f6e5e0;
    --amber:#a3741d; --amber-bg:#f4ecd9;
    --hidden:#89908b; --hidden-bg:#ecefea;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111511; --ink:#e7ece5; --muted:#98a199; --line:#283028; --card:#181e19;
      --green:#46cf88; --green-bg:#12321f;
      --red:#ea846a; --red-bg:#3c1d15;
      --amber:#ddb04e; --amber-bg:#332a18;
      --hidden:#7c857d; --hidden-bg:#1f251f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111511; --ink:#e7ece5; --muted:#98a199; --line:#283028; --card:#181e19;
    --green:#46cf88; --green-bg:#12321f;
    --red:#ea846a; --red-bg:#3c1d15;
    --amber:#ddb04e; --amber-bg:#332a18;
    --hidden:#7c857d; --hidden-bg:#1f251f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; padding:24px 16px 56px;
  }
  .wrap{max-width:960px; margin:0 auto}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  h1{font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em}
  .sub{color:var(--muted); font-size:13px; margin:0 0 14px; max-width:66ch}
  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:14px}
  .legend .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .btn{
    font-family:inherit; font-size:13px; font-weight:500;
    padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .btn:hover{border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--green); outline-offset:1px}
  .hint{font-size:12px; color:var(--muted); margin:0}
  .tree-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:10px 6px}
  .node{
    display:flex; align-items:center; gap:8px;
    padding:2px 6px; white-space:nowrap; font-size:13.5px; border-radius:6px;
    margin-left:calc(var(--d) * 18px); min-width:max-content;
  }
  .node .arrow{width:14px; color:var(--muted); font-size:12px; flex:none; cursor:pointer; user-select:none}
  .node .arrow.dead{color:var(--line); cursor:default}
  .node .chain{font-family:"IBM Plex Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:0.02em; color:var(--muted); cursor:pointer}
  .node .chain.lit{color:var(--ink); font-weight:600}
  .badge{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; flex:none}
  .badge.l1{background:var(--green-bg); color:var(--green)}
  .badge.l2{background:var(--red-bg); color:var(--red)}
  .badge.l3{background:var(--amber-bg); color:var(--amber)}
  .badge.bright{outline:2px solid currentColor; outline-offset:1px}
  .badge.hidden{background:var(--hidden-bg); color:var(--hidden); font-weight:500}
  .note{
    font-family:inherit; font-size:12px; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:1px 8px; width:170px; margin-left:8px; flex:none;
  }
  .note:hover{border-color:var(--line); background:var(--card)}
  .note:focus{border-color:var(--green); background:var(--card); outline:none}
  .note::placeholder{color:var(--hidden)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header><h1>密码子进化树</h1></header>
  <p class="sub">只画主链，没有隐藏链。从 <b>11</b> 展开到第 6 位。<b>1124</b> 绿、<b>1123</b> 红、<b>1122</b> 黄：第 4 位中了就显。第 5 位等于第 4 位才继续显，不等则隐；第 6 位必显，再等于第 4 位则亮一档。</p>
  <div class="legend">
    <span class="chip"><span class="dot" style="background:var(--green)"></span>绿（1124）</span>
    <span class="chip"><span class="dot" style="background:var(--red)"></span>红（1123）</span>
    <span class="chip"><span class="dot" style="background:var(--amber)"></span>黄（1122）</span>
    <span class="chip"><span class="dot" style="background:var(--hidden)"></span>隐（第5位没对上）</span>
    <span class="chip">描边 = 亮一档</span>
  </div>

  <div class="toolbar">
    <button class="btn" id="copy">复制所有备注</button>
    <span class="hint">备注只存你这台浏览器；换设备不带走。</span>
  </div>

  <div class="tree-scroll" id="tree"></div>
</div>

<script>
  const MAX_LEN = 6;
  const NOTES_KEY = 'fly-codon-notes';

  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch (e) { notes = {}; }
  function saveNotes(){
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {}
  }
  function setNote(chain, text){
    if (text.trim()) notes[chain] = text; else delete notes[chain];
    saveNotes();
  }

  function nodeState(chain){
    if (chain.length < 4) return { badge:false };
    const prefix = chain.slice(0, 4);
    const fam = { '1124': { name:'绿', cls:'l1' }, '1123': { name:'红', cls:'l2' }, '1122': { name:'黄', cls:'l3' } }[prefix];
    if (!fam) return { badge:false };
    if (chain.length === 4) return { badge:true, cls:fam.cls, label: fam.name };
    const d4 = prefix[3];
    if (chain.length === 5) {
      if (chain[4] === d4) return { badge:true, cls:fam.cls, label: fam.name };
      return { badge:true, cls:'hidden', label: '隐' };
    }
    const bright = chain[5] === d4;
    return { badge:true, cls: fam.cls + (bright ? ' bright' : ''), label: bright ? fam.name + '·亮' : fam.name };
  }
  function children(node){
    return ['1','2','3','4'].map(d => ({ chain: node.chain + d }));
  }

  const tree = document.getElementById('tree');
  const expanded = new Set(['11', '112']);

  function toggle(chain){
    if (expanded.has(chain)) expanded.delete(chain);
    else expanded.add(chain);
    render();
  }

  function render(){
    tree.innerHTML = '';
    (function build(parent, chain, depth){
      const st = nodeState(chain);
      const canOpen = chain.length < MAX_LEN;
      const isOpen = expanded.has(chain);
      const lit = /^(1124|1123|1122)/.test(chain);

      const row = document.createElement('div');
      row.className = 'node';
      row.style.setProperty('--d', depth);

      const arrow = document.createElement('span');
      arrow.className = 'arrow' + (canOpen ? '' : ' dead');
      arrow.textContent = canOpen ? (isOpen ? '▾' : '▸') : '·';
      if (canOpen) arrow.addEventListener('click', () => toggle(chain));

      const chainEl = document.createElement('span');
      chainEl.className = 'chain' + (lit ? ' lit' : '');
      chainEl.textContent = chain;
      if (canOpen) chainEl.addEventListener('click', () => toggle(chain));

      const b = st.badge ? (function(){
        const t = document.createElement('span');
        t.className = 'badge ' + st.cls;
        t.textContent = st.label;
        return t;
      })() : null;

      const input = document.createElement('input');
      input.className = 'note';
      input.placeholder = '备注颜色';
      input.value = notes[chain] || '';
      input.addEventListener('input', () => setNote(chain, input.value));

      row.append(arrow, chainEl);
      if (b) row.append(b);
      row.append(input);
      parent.appendChild(row);

      if (isOpen && canOpen){
        for (const c of children({ chain })) build(parent, c.chain, depth + 1);
      }
    })(tree, '11', 0);
  }

  document.getElementById('copy').addEventListener('click', () => {
    const lines = Object.entries(notes)
      .filter(([k, v]) => v.trim())
      .map(([k, v]) => k + ' = ' + v.trim())
      .join('\n');
    if (!lines) { alert('还没有备注'); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines).then(() => alert('已复制 ' + Object.keys(notes).length + ' 条备注'));
    } else {
      prompt('复制下面内容：', lines);
    }
  });

  render();
</script>
