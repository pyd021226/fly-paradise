<title>果蝇商店</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4efe6; --ink:#2a241c; --muted:#7a7166; --line:#ddd4c6; --btn:#fffdf8; --pink:#e23d7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "IBM Plex Sans", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  input, button { font: inherit; }
  input { width: 100%; border: 1px solid var(--line); background: var(--btn); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
  button { border: 1px solid var(--line); background: var(--btn); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button.primary { background: var(--pink); color: #fff; border-color: transparent; font-weight: 650; width: 100%; }
  button.off { background: #2a241c; color: #fff; border-color: transparent; font-size: 13px; padding: 6px 10px; }
  .tip { color: var(--pink); min-height: 1.3em; font-size: 13px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 0; margin: 0 0 14px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 10px 10px 0 0; background: transparent; padding: 10px 18px; color: var(--muted); font-weight: 600; }
  .tabs button.on { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-bottom-color: var(--btn); margin-bottom: -1px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .cats button { padding: 6px 12px; font-size: 13px; }
  .cats button.on { background: #2a241c; color: #fff; border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .card canvas { display: block; width: 100%; height: auto; aspect-ratio: 160 / 72; margin: 0 0 8px; background: #fff; border-radius: 8px; object-fit: contain; }
  .card .note { font-weight: 600; margin: 0 0 4px; word-break: break-word; }
  .card .who { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .card .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #app { display: none; }
  .fly { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .pane { display: none; }
  .pane.on { display: block; }
  #cover { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
  #cover.on { display: flex; }
  .sheet { background: var(--paper); width: min(420px, 100%); max-height: 80vh; overflow: auto; border-radius: 12px; padding: 16px; }
  .sheet h2 { font-size: 17px; margin: 0 0 10px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
<div class="wrap">
  <h1>果蝇商店</h1>
  <p class="sub">和游戏同一个账号。上架请在游戏瓶子里操作。</p>
  <p class="tip" id="tip"></p>
  <div id="login">
    <input id="email" type="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <button class="primary" id="loginBtn" type="button">登录</button>
  </div>
  <div id="app">
    <div class="tabs">
      <button type="button" id="tabMine" class="on">我的商品</button>
      <button type="button" id="tabMall">商城</button>
      <button type="button" id="logout" style="margin-left:auto">退出登录</button>
    </div>
    <div id="paneMine" class="pane on">
      <p class="sub">收到的报价（一张卡一个报价，含备注和数量）</p>
      <div class="grid" id="gridInbox"></div>
      <p class="sub" style="margin-top:20px">我上架的</p>
      <div class="grid" id="gridMine"></div>
      <p class="sub" style="margin-top:20px">我出的报价（可撤回）</p>
      <div class="grid" id="gridBids"></div>
    </div>
    <div id="paneMall" class="pane">
      <div class="cats" id="cats"></div>
      <input id="q" type="search" placeholder="搜索备注、卖家、种类">
      <div class="grid" id="gridMall"></div>
      <p class="sub" style="margin-top:20px">勾选要拿去换的，可写备注，再点卡片上的「用勾选报价」。</p>
      <input id="bidNote" type="text" placeholder="报价备注（对方能看见）" maxlength="40">
      <div id="flies"></div>
    </div>
  </div>
  <div id="cover">
    <div class="sheet">
      <h2 id="coverTitle">我的报价</h2>
      <div class="grid" id="coverList"></div>
      <button type="button" id="coverClose" style="width:100%;margin-top:12px">关闭</button>
    </div>
  </div>
</div>
<script>
  const URL = "https://asfhegiiqhgaodpmqvlh.supabase.co";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzZmhlZ2lpcWhnYW9kcG1xdmxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDU0MDAsImV4cCI6MjEwNTcyMTQwMH0._iFe4e77vDLX6vreQE8jci7az8_t1_U1sdnspmiALbQ";
  const KEY = "fly-shop-session";
  const kindName = { fly: "果蝇", egg: "卵", larva: "幼虫", pupa: "蛹", item: "道具" };
  const CATS = [
    { id: "all", label: "全部" },
    { id: "egg", label: "卵", kinds: ["egg"] },
    { id: "larva", label: "幼虫", kinds: ["larva"] },
    { id: "pupa", label: "蛹", kinds: ["pupa"] },
    { id: "fly", label: "果蝇", kinds: ["fly"] },
    { id: "item", label: "道具", kinds: ["item"] },
  ];
  let token = "", email = "", uid = "", tipTimer = 0;
  let listings = [], allOffers = [], cat = "all", q = "";

  function tip(t) {
    const el = document.getElementById("tip");
    el.textContent = t || "";
    clearTimeout(tipTimer);
    if (!t) return;
    const keep = t;
    tipTimer = setTimeout(() => { if (el.textContent === keep) el.textContent = ""; }, 3000);
  }
  function headers(extra) {
    return Object.assign({ apikey: ANON, Authorization: "Bearer " + token, "Content-Type": "application/json" }, extra || {});
  }
  async function req(path, opts) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch(URL + path, Object.assign({ headers: headers(), signal: ctrl.signal }, opts || {}));
      const text = await r.text();
      let body = {};
      try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
      if (!r.ok) throw new Error(body.message || body.error || ("HTTP " + r.status));
      return body;
    } finally { clearTimeout(t); }
  }
  function isMine(l) { return l.seller_id === uid || l.seller_email === email; }
  function kindLabel(k) { return kindName[k] || k || ""; }
  function matchCat(l) {
    if (cat === "all") return true;
    const c = CATS.find((x) => x.id === cat);
    return c && c.kinds && c.kinds.indexOf(l.kind) >= 0;
  }
  function matchQ(l) {
    const s = (q || "").trim().toLowerCase();
    if (!s) return true;
    const blob = [(l.note || ""), (l.seller_email || ""), kindLabel(l.kind), (l.kind || "")].join(" ").toLowerCase();
    return blob.indexOf(s) >= 0;
  }

  function qtyOf(o) {
    if (Number(o.quantity) > 0) return Number(o.quantity);
    if (Array.isArray(o.fly_ids) && o.fly_ids.length) return o.fly_ids.length;
    return 1;
  }
  function busyFlyIds() {
    const s = new Set();
    for (const o of allOffers) {
      if (o.status !== "pending") continue;
      if (o.buyer_email !== email && o.buyer_id !== uid) continue;
      const ids = (Array.isArray(o.fly_ids) && o.fly_ids.length) ? o.fly_ids : (o.fly_id ? [o.fly_id] : []);
      ids.forEach((id) => s.add(id));
    }
    return s;
  }

  function drawThumb(cv, kind, color, qty) {
    const ctx = cv.getContext("2d");
    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#faf8f3";
    ctx.fillRect(0, 0, w, h);
    const pal = { wild: "#d4a056", mid: "#aa743c", deep: "#4a2c12", white: "#efe8dc", green: "#1aa85a", red: "#c0392b" };
    const body = pal[color] || pal.wild;
    const n = Math.max(1, Math.min(3, qty || 1));
    for (let i = 0; i < n; i++) {
      const x = w / 2 + (i - (n - 1) / 2) * 28;
      const y = h / 2 + 4;
      ctx.save();
      ctx.translate(x, y);
      if (kind === "egg") {
        ctx.fillStyle = "#f4f1e8";
        ctx.strokeStyle = "rgba(180,170,150,0.8)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, 0, 10, 5, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (kind === "larva") {
        ctx.fillStyle = "#d9cbb0";
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 4.5, 0.2, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "pupa") {
        ctx.fillStyle = "#caa060";
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0.3, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "item") {
        ctx.fillStyle = "#6b9ac4";
        ctx.fillRect(-8, -10, 16, 20);
        ctx.fillStyle = "#eee";
        ctx.fillRect(-5, -7, 10, 8);
      } else {
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.ellipse(0, 5, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c48a48";
        ctx.beginPath(); ctx.ellipse(0, -5, 3.5, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d44532";
        ctx.beginPath(); ctx.ellipse(-2.5, -5.2, 2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(2.5, -5.2, 2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function listingCard(l, withBid) {
    const card = document.createElement("div");
    card.className = "card";
    const cv = document.createElement("canvas");
    cv.width = 160; cv.height = 72;
    drawThumb(cv, l.kind, l.color, l.quantity || 1);
    card.appendChild(cv);
    const note = document.createElement("div"); note.className = "note";
    note.textContent = l.note || kindLabel(l.kind);
    const who = document.createElement("div"); who.className = "who";
    who.textContent = kindLabel(l.kind) + " · " + (l.seller_email || "").split("@")[0] + " · ×" + (l.quantity || 1);
    const row = document.createElement("div"); row.className = "row";
    card.append(note, who, row);
    if (!withBid) {
      const u = document.createElement("button");
      u.className = "off"; u.textContent = "下架";
      u.onclick = async () => {
        try {
          await req("/rest/v1/listings?id=eq." + l.id, { method: "PATCH", headers: headers({ Prefer: "return=minimal" }), body: JSON.stringify({ status: "closed" }) });
          tip("已下架"); await refresh();
        } catch (e) { tip("下架失败：" + e.message); }
      };
      row.appendChild(u);
    } else {
      const mineBids = allOffers.filter((o) => o.status === "pending" && o.listing_id === l.id && (o.buyer_email === email || o.buyer_id === uid));
      const bid = document.createElement("button");
      bid.className = "off";
      if (mineBids.length) {
        bid.textContent = "报价中";
        bid.onclick = (e) => { e.preventDefault(); openCover(l, mineBids); };
      } else {
        bid.textContent = "用勾选报价";
        bid.onclick = async () => {
          const ids = [...document.querySelectorAll("#flies input:checked")].map((x) => x.value);
          if (!ids.length) { tip("先在下方勾选要拿去换的果蝇"); return; }
          try {
            await req("/rest/v1/offers", {
              method: "POST",
              headers: headers({ Prefer: "return=minimal" }),
              body: JSON.stringify({
                listing_id: l.id, buyer_id: uid, buyer_email: email,
                kind: "fly", fly_id: ids[0], fly_ids: ids.slice(0, 3), quantity: Math.min(3, ids.length),
                color: "wild", note: (document.getElementById("bidNote").value || "").trim(), status: "pending",
              }),
            });
            tip("已报价"); await refresh();
          } catch (e) { tip("报价失败：" + e.message); }
        };
      }
      row.appendChild(bid);
    }
    return card;
  }

  function offerCard(o, asSeller) {
    const listed = o.listings || {};
    const card = document.createElement("div");
    card.className = "card";
    const n = qtyOf(o);
    const title = (o.note && o.note.trim()) ? o.note.trim() : ("用" + kindLabel(o.kind) + " ×" + n);
    const cv = document.createElement("canvas");
    cv.width = 160; cv.height = 72;
    drawThumb(cv, o.kind, o.color, n);
    card.appendChild(cv);
    const noteEl = document.createElement("div"); noteEl.className = "note"; noteEl.textContent = title;
    const who = document.createElement("div"); who.className = "who";
    who.textContent = asSeller
      ? ((o.buyer_email || "").split("@")[0] + " 报价 · " + kindLabel(o.kind) + " ×" + n + " · 换你的「" + (listed.note || kindLabel(listed.kind) || "商品") + "」")
      : ("换「" + (listed.note || kindLabel(listed.kind) || "商品") + "」· " + kindLabel(o.kind) + " ×" + n);
    const row = document.createElement("div"); row.className = "row";
    card.append(noteEl, who, row);
    if (asSeller) {
      const acc = document.createElement("button");
      acc.className = "off"; acc.textContent = "接受";
      acc.onclick = async () => {
        try {
          await req("/rest/v1/rpc/accept_offer", { method: "POST", body: JSON.stringify({ p_offer_id: o.id }) });
          tip("已交换"); await refresh();
        } catch (e) { tip("接受失败：" + e.message); }
      };
      const rej = document.createElement("button");
      rej.className = "off"; rej.textContent = "拒绝";
      rej.onclick = async () => {
        try {
          await req("/rest/v1/offers?id=eq." + o.id, { method: "PATCH", headers: headers({ Prefer: "return=minimal" }), body: JSON.stringify({ status: "rejected" }) });
          tip("已拒绝"); await refresh();
        } catch (e) { tip("拒绝失败：" + e.message); }
      };
      row.appendChild(acc); row.appendChild(rej);
    } else {
      const w = document.createElement("button");
      w.className = "off"; w.textContent = "撤回";
      w.onclick = async () => {
        try {
          await req("/rest/v1/offers?id=eq." + o.id, { method: "PATCH", headers: headers({ Prefer: "return=minimal" }), body: JSON.stringify({ status: "rejected" }) });
          tip("已撤回");
          document.getElementById("cover").classList.remove("on");
          await refresh();
        } catch (e) { tip("撤回失败：" + e.message); }
      };
      row.appendChild(w);
    }
    return card;
  }

  function render() {
    const mine = listings.filter(isMine);
    const mall = listings.filter((l) => !isMine(l) && matchCat(l) && matchQ(l));
    const inbox = allOffers.filter((o) => o.status === "pending" && mine.some((l) => l.id === o.listing_id));
    const bids = allOffers.filter((o) => o.status === "pending" && (o.buyer_email === email || o.buyer_id === uid));
    const gi = document.getElementById("gridInbox");
    const gm = document.getElementById("gridMine");
    const gb = document.getElementById("gridBids");
    const ga = document.getElementById("gridMall");
    gi.innerHTML = ""; gm.innerHTML = ""; gb.innerHTML = ""; ga.innerHTML = "";
    if (!inbox.length) gi.innerHTML = "<p class='sub'>还没有人向你报价</p>";
    else inbox.forEach((o) => gi.appendChild(offerCard(o, true)));
    if (!mine.length) gm.innerHTML = "<p class='sub'>还没有自己上架的东西</p>";
    else mine.forEach((l) => gm.appendChild(listingCard(l, false)));
    if (!bids.length) gb.innerHTML = "<p class='sub'>没有进行中的报价</p>";
    else bids.forEach((o) => gb.appendChild(offerCard(o, false)));
    if (!mall.length) ga.innerHTML = "<p class='sub'>没有符合条件的商品</p>";
    else mall.forEach((l) => ga.appendChild(listingCard(l, true)));
  }

  function openCover(listing, bids) {
    document.getElementById("coverTitle").textContent = "报价中 · " + (listing.note || kindLabel(listing.kind));
    const box = document.getElementById("coverList");
    box.innerHTML = "";
    if (!bids.length) box.innerHTML = "<p class='sub'>没有报价</p>";
    else bids.forEach((o) => box.appendChild(offerCard(o, false)));
    document.getElementById("cover").classList.add("on");
  }

  function setTab(which) {
    const mine = which === "mine";
    document.getElementById("tabMine").classList.toggle("on", mine);
    document.getElementById("tabMall").classList.toggle("on", !mine);
    document.getElementById("paneMine").classList.toggle("on", mine);
    document.getElementById("paneMall").classList.toggle("on", !mine);
  }

  async function refresh() {
    listings = await req("/rest/v1/listings?status=eq.open&select=id,seller_id,seller_email,kind,color,note,quantity,fly_id,fly_ids&order=created_at.desc&limit=80");
    let offers = [];
    try {
      offers = await req("/rest/v1/offers?select=id,listing_id,buyer_id,buyer_email,kind,color,note,quantity,fly_id,fly_ids,status,listings(note,kind,seller_email)&status=eq.pending&order=created_at.desc&limit=80");
    } catch (e) { offers = []; }
    allOffers = offers || [];
    render();
    try {
      const flies = await req("/rest/v1/flies?select=id,color,level&limit=40");
      const box = document.getElementById("flies");
      box.innerHTML = "";
      const busy = busyFlyIds();
      const free = (flies || []).filter((f) => !busy.has(f.id));
      for (const f of free) {
        const row = document.createElement("label");
        row.className = "fly";
        row.innerHTML = "<input type='checkbox'><span></span>";
        row.querySelector("input").value = f.id;
        row.querySelector("span").textContent = (f.color || "wild") + " · " + f.id.slice(0, 8);
        box.appendChild(row);
      }
      if (!flies.length) box.textContent = "服务器上还没有你的果蝇。先在游戏里养。";
      else if (!free.length) box.textContent = "可用的都在报价中。点商品上的「报价中」可撤回。";
    } catch (e) {
      document.getElementById("flies").textContent = "读不到果蝇：" + e.message;
    }
  }

  async function login() {
    const em = document.getElementById("email").value.trim();
    const pw = document.getElementById("password").value;
    if (!em || !pw) { tip("填邮箱和密码"); return; }
    tip("登录中…");
    const body = await req("/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email: em, password: pw }),
    });
    token = body.access_token;
    email = body.user && body.user.email;
    uid = body.user && body.user.id;
    try { localStorage.setItem(KEY, JSON.stringify({ access_token: token, email, uid, refresh_token: body.refresh_token })); } catch (e) {}
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    tip("已登录");
    await refresh();
  }

  const cats = document.getElementById("cats");
  CATS.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c.label;
    if (c.id === "all") b.className = "on";
    b.onclick = () => {
      cat = c.id;
      [...cats.children].forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      render();
    };
    cats.appendChild(b);
  });
  document.getElementById("q").addEventListener("input", () => { q = document.getElementById("q").value; render(); });
  document.getElementById("tabMine").onclick = () => setTab("mine");
  document.getElementById("tabMall").onclick = () => setTab("mall");
  document.getElementById("coverClose").onclick = () => document.getElementById("cover").classList.remove("on");
  document.getElementById("cover").addEventListener("click", (e) => {
    if (e.target.id === "cover") document.getElementById("cover").classList.remove("on");
  });
  document.getElementById("logout").onclick = () => {
    token = ""; email = ""; uid = "";
    try { localStorage.removeItem(KEY); } catch (e) {}
    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "block";
    document.getElementById("password").value = "";
    tip("已退出");
  };
  document.getElementById("loginBtn").onclick = () => login().catch((e) => tip(e.message));

  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.access_token) {
      token = s.access_token; email = s.email; uid = s.uid;
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      refresh().catch((e) => tip(e.message));
    }
  } catch (e) {}
</script>
