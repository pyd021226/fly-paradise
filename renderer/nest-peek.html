<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; overflow: hidden; background: transparent; width: 100%; height: 100%; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const pal = {
    wild: '#d4a056', mid: '#aa743c', deep: '#4a2c12', white: '#f3eee4',
    green: '#1aa85a', green2: '#3dff88', red: '#c0392b', red2: '#ff5a4a',
    yellow: '#e6c84a', yellow2: '#ffe566',
  };

  function fit() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  addEventListener('resize', fit);
  fit();

  function drawEgg(u) {
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(u.rot || 0);
    ctx.fillStyle = '#c4b496';
    ctx.beginPath();
    ctx.ellipse(0, 0, 4.2, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawLarva(u) {
    const instar = u.instar || 1;
    const len = instar === 1 ? 6 : instar === 2 ? 12 : 18;
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(u.heading || 0);
    ctx.fillStyle = pal[u.color] || '#b39470';
    ctx.beginPath();
    ctx.ellipse(0, 0, len * 0.5, 2 + instar * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPupa(u, empty) {
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(u.rot || 0);
    ctx.fillStyle = empty ? 'rgba(90,60,30,0.35)' : '#6b4524';
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFood(u) {
    ctx.fillStyle = 'hsl(42, 55%, 62%)';
    ctx.beginPath();
    ctx.arc(u.x, u.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  window.peek.onDraw((d) => {
    fit();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!d || !d.on || !d.units) return;
    for (const u of d.units) {
      if (u.kind === 'egg') drawEgg(u);
      else if (u.kind === 'larva') drawLarva(u);
      else if (u.kind === 'pupa') drawPupa(u, false);
      else if (u.kind === 'shell') drawPupa(u, true);
      else if (u.kind === 'food') drawFood(u);
    }
  });
</script>
</body>
</html>
