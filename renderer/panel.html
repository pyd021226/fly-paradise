<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>果蝇乐园</title>
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #2a241c;
      --muted: #7a7166;
      --btn: #fffdf8;
      --line: #ddd4c6;
      --pink: #e23d7a;
    }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .layout { display: block; }
    main { padding: 18px 16px 16px; }
    .jar-msg {
      min-height: 1.2em;
      font-size: 12px;
      color: var(--pink);
      margin: 0 0 8px;
    }
    #shopStatus {
      min-height: 1.2em;
      margin: -8px 0 12px;
    }
    #captureSection { display: none; }
    #captureSection.open { display: block; }
    h1 {
      font-size: 17px;
      font-weight: 650;
      margin: 0 0 4px;
    }
    p.hint {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 16px;
      min-height: 2.6em;
    }
    button {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--ink);
      border-radius: 10px;
      padding: 11px 12px;
      margin: 0 0 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.97); }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--pink);
      color: #fff;
      border-color: transparent;
      font-weight: 650;
      padding: 14px 12px;
      font-size: 15px;
      margin-bottom: 12px;
    }
    button.primary.on,
    button.on {
      background: #2a241c;
      color: #fff;
      border-color: transparent;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row button { margin: 0; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.2); }
    .stats {
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--btn);
      font-size: 12px;
      line-height: 1.65;
      color: var(--ink);
    }
    .stats .m { display: block; }
    .add-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .add-row button { margin: 0; }
    .add-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-row input { margin: 0; accent-color: var(--ink); }
    .stats b { font-weight: 650; }
    .foot {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .foot input { margin: 0; accent-color: var(--ink); }
    .note {
      margin: -2px 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    #gate { display: none; }
    body.gate #login { display: none; }
    body.gate #game { display: block; }
    body.gate #game > :not(#gate) { display: none; }
    body.gate #gate { display: block; }
    input {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 8px;
      font: inherit;
      box-sizing: border-box;
    }
    #login { display: none; }
    #game { display: block; }
    body.need-login #login { display: block; }
    body.need-login #game { display: none; }
    #shop { padding: 10px 8px 12px; overflow: hidden; }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .shop-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      padding: 4px 3px 6px;
      text-align: center;
      min-width: 0;
    }
    .shop-card canvas { display: block; width: 100%; height: 48px; }
    .shop-card .qty { font-size: 11px; color: var(--muted); }
    .shop-card .who { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-card .cap {
      font-size: 11px;
      color: var(--ink);
      margin-top: 2px;
      min-height: 2.4em;
      word-break: break-word;
    }
    .shop-card .off {
      display: block;
      width: 100%;
      margin: 4px 0 0;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 650;
      border-radius: 6px;
      background: #2a241c;
      color: #fff;
      border-color: transparent;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
<div class="layout">
  <main>
    <div id="login">
      <h1>果蝇乐园</h1>
      <p class="hint">登录后开始养果蝇。</p>
      <input id="loginEmail" type="email" placeholder="邮箱">
      <input id="loginPassword" type="password" placeholder="密码">
      <button class="primary" id="loginBtn" type="button">登录</button>
      <p class="hint" id="loginMsg"></p>
    </div>
    <div id="game">
    <div id="gate">
      <h1>上次繁殖还在</h1>
      <p class="hint">继续接着养，或清场重开。</p>
      <button class="primary" id="resume" type="button">继续</button>
      <button id="restart" type="button">重新开始</button>
    </div>
    <h1>果蝇乐园</h1>
    <p class="hint" id="hint">苍蝇在桌面上。点下面拿拍去打，Esc 收起。</p>
    <div class="stats" id="stats">成虫 0　卵 0　蛆 0/0/0　蛹 0<br><span class="m">褐色 0</span><span class="m">中褐 0</span><span class="m">深褐 0</span><span class="m">白色 0</span></div>
    <div class="stats" id="points">积分 0</div>
    <div class="stats" id="leaderboard">排行榜加载中…</div>
    <p class="jar-msg" id="shopStatus"></p>
    <button id="openShop" type="button">打开商店网页</button>
    <button id="xray" type="button">全图透视</button>
    <button class="primary" id="swatter" type="button">拿出苍蝇拍</button>
    <button id="rag" type="button">拿出抹布</button>
    <button id="capture" type="button">捕捉</button>
    <div id="captureSection">
      <button id="net" type="button">拿出捕网</button>
      <p class="note">瓶内待满 2 分钟会死亡，留下尸体。</p>
      <p class="jar-msg" id="jarMsg"></p>
      <input id="sellNote" type="text" placeholder="备注这是什么（写在图下）" maxlength="40">
      <div class="row"><button id="jarAll" type="button">瓶内全选</button><button id="jarSell" type="button">上架选中</button></div>
      <button id="jarFree" type="button">放回选中</button>
    </div>
    <p class="note">按 Esc 退出</p>
    <div class="add-row">
      <button id="add" type="button">加一只</button>
      <label><input id="sexF" type="checkbox">雌</label>
      <label><input id="sexM" type="checkbox" checked>雄</label>
    </div>
    <button id="scare" type="button">吓它们</button>
    <button id="codon" type="button">显示基因码</button>
    <button id="fast" type="button">快进</button>
    <button id="quit" type="button">退出</button>
    <label class="foot"><input id="autoStart" type="checkbox">开机启动</label>
    </div>
  </main>
</div>
  <script src="./panel.js"></script>
</body>
</html>
